<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #1711c3;
            --primary-soft: #eef2ff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dbe3f0;
            --surface: #ffffff;
            --bg1: #eef2ff;
            --bg2: #f8fafc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 16px;
            background:
                linear-gradient(135deg, rgba(238, 242, 255, 0.9), rgba(248, 250, 252, 0.88)),
                url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
        }

        .form-card {
            width: min(820px, 100%);
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(79, 70, 229, 0.08);
            border-radius: 24px;
            box-shadow: 0 22px 50px rgba(31, 41, 55, 0.12);
            padding: 36px 34px;
            backdrop-filter: blur(10px);
        }

        .header {
            margin-bottom: 26px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 4vw, 38px);
            color: var(--primary-dark);
        }

        .intro {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        fieldset {
            border: 0;
            margin: 0 0 28px;
            padding: 0;
        }

        legend {
            width: 100%;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #edf2ff;
            color: var(--primary-dark);
            font-size: 18px;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
            color: var(--text);
            font: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        input:hover, select:hover, textarea:hover {
            border-color: #b7c3ee;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 130px;
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-top: 10px;
        }

        .required {
            font-size: 12px;
            color: var(--muted);
        }

        button {
            padding: 14px 26px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #6d5ef6);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(79, 70, 229, 0.3);
        }

        @media (max-width: 600px) {
            .form-card {
                padding: 24px 18px;
                border-radius: 18px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="form-card">
        <div class="header">
            <h1>Internship Application</h1>
            <p class="intro">Take the next step in your career. Tell us about yourself and the internship you are looking for.</p>
        </div>

        <form action="#" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>Personal information</legend>
                <div class="grid">
                    <div class="field">
                        <label for="first-name">First name *</label>
                        <input id="first-name" name="first_name" type="text" required>
                    </div>
                    <div class="field">
                        <label for="last-name">Last name *</label>
                        <input id="last-name" name="last_name" type="text" required>
                    </div>
                    <div class="field">
                        <label for="email">Email address *</label>
                        <input id="email" name="email" type="email" required>
                    </div>
                    <div class="field">
                        <label for="phone">Phone number</label>
                        <input id="phone" name="phone" type="tel">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Internship details</legend>
                <div class="grid">
                    <div class="field">
                        <label for="role">Preferred role *</label>
                        <select id="role" name="role" required>
                            <option value="">Select a role</option>
                            <option>Software Development</option>
                            <option>UI/UX Design</option>
                            <option>Marketing</option>
                            <option>Data Analytics</option>
                            <option>Human Resources</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="start-date">Available start date *</label>
                        <input id="start-date" name="start_date" type="date" required>
                    </div>
                    <div class="field full">
                        <label for="education">School or university *</label>
                        <input id="education" name="education" type="text" required>
                    </div>
                    <div class="field full">
                        <label for="resume">Resume *</label>
                        <input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" required>
                        <span class="hint">PDF, DOC, or DOCX up to 5 MB</span>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>About you</legend>
                <div class="field">
                    <label for="message">Why are you interested in this internship? *</label>
                    <textarea id="message" name="message" placeholder="Tell us about your goals, skills, and experience..." required></textarea>
                </div>
            </fieldset>

            <div class="actions">
                <span class="required">* Required fields</span>
                <button type="submit">Submit application</button>
            </div>
        </form>
    </main>
</body>
</html>
